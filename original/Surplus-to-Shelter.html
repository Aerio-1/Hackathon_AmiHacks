<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Surplus-to-Shelter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}button{cursor:pointer}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp .8s linear infinite}</style></head>
<body><div id="root"></div>
<script>
const {useState,useEffect,useMemo}=React;
const h=(t,p,...c)=>React.createElement(t,p&&p.class!==undefined?{...p,className:p.class,class:undefined}:p,...c);
const html=htm.bind(h);
/* ---------- config & mock data (swap for API later) ---------- */
const MIN=60000,KM=0.15,MPK=4,BUF=20; // km per grid unit, min per km (city traffic), safety buffer (min)
const STAGES=['Posted','Matching','Matched','Pickup Accepted','Picked Up','In Transit','Delivered'];
const ICON={'Prepared Food':'🍚','Produce':'🥦','Bakery':'🥖','Packaged':'📦'},CATS=Object.keys(ICON);
const donors=[{id:'d1',name:'Restaurant XYZ',x:40,y:45},{id:'d2',name:'FreshMart Grocers',x:70,y:30},{id:'d3',name:'Spice Route Caterers',x:20,y:70},{id:'d4',name:'Campus Cafeteria',x:80,y:75},{id:'d5',name:'Sunrise Bakery',x:55,y:15}];
const shelters=[{id:'s1',name:'Hope Shelter',x:45,y:58,cap:40,max:100,needs:['Prepared Food','Produce']},{id:'s2',name:'Annapurna Kitchen',x:30,y:40,cap:30,max:80,needs:['Prepared Food','Packaged']},{id:'s3',name:'Riverside Community Home',x:60,y:50,cap:8,max:60,needs:['Prepared Food']},{id:'s4',name:'Sahara Food Bank',x:25,y:30,cap:60,max:200,needs:['Packaged','Bakery']},{id:'s5',name:'Bright Futures Home',x:75,y:65,cap:50,max:90,needs:['Prepared Food','Produce']},{id:'s6',name:'Safe Harbor NGO',x:85,y:20,cap:35,max:70,needs:['Prepared Food']}];
const drivers=[{id:'v1',name:'Aarav (You)',x:42,y:48,free:true},{id:'v2',name:'Meera',x:65,y:35,free:true},{id:'v3',name:'Rohan',x:22,y:66,free:true},{id:'v4',name:'Isha',x:78,y:70,free:false},{id:'v5',name:'Kabir',x:30,y:35,free:true}];
const D=(id,food,cat,qty,donor,mins,status='Posted',shelter=null)=>({id,food,cat,qty,donor,exp:Date.now()+mins*MIN,status,shelter,driver:null,accepted:false});
const seed=()=>[D('n1','Veg Biryani','Prepared Food',30,'d3',150),D('n2','Fresh Vegetables','Produce',40,'d2',240),D('n3','Bakery Assortment','Bakery',12,'d5',45),D('n4','Dal & Roti Packs','Prepared Food',18,'d4',38),D('n5','Packaged Snacks','Packaged',60,'d2',600),D('n6','Soup Trays','Prepared Food',55,'d1',90),D('n7','Curry Meal Boxes','Prepared Food',20,'d4',24),D('n8','Sandwich Platters','Prepared Food',10,'d5',120,'Matched','s2'),D('n9','Paneer Curry','Prepared Food',15,'d1',100,'In Transit','s1'),D('n10','Fruit Crates','Produce',25,'d2',300)];
const LOG0=[{food:'Roti Bundles',qty:22,donor:'d4',shelter:'s2',ago:'2h ago'},{food:'Mixed Vegetables',qty:35,donor:'d2',shelter:'s1',ago:'5h ago'},{food:'Bread Loaves',qty:14,donor:'d5',shelter:'s4',ago:'Yesterday'}];
const N0=[{id:1,m:'🔔 New donation available 2.4 km away.',t:'2m ago'},{id:2,m:'⚠️ 10 kg of food expires in 42 minutes.',t:'8m ago'},{id:3,m:'✅ 22 kg Roti Bundles delivered to Annapurna Kitchen.',t:'2h ago'}];
/* ---------- matching engine (rule-based, transparent) ---------- */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)*KM;
const left=d=>Math.floor((d.exp-Date.now())/MIN);
const avail=d=>d.status!=='Delivered'&&(d.exp>Date.now()||STAGES.indexOf(d.status)>=3);
const tone=d=>{const m=(d.exp-Date.now())/MIN;return m<=0?'red':m<60?'amber':'green'};
const fmt=d=>{const s=Math.floor((d.exp-Date.now())/1000);if(s<=0)return'Expired';const H=Math.floor(s/3600),M=Math.floor(s%3600/60);return H?`${H}h ${M}m remaining`:`${M}m ${String(s%60).padStart(2,'0')}s remaining`};
const nearestDriver=(src,ds)=>ds.filter(v=>v.free).sort((a,b)=>dist(a,src)-dist(b,src))[0];
// Score = Distance 30 + Capacity 25 + Food need 20 + Time feasibility 25. Capacity or time failure => excluded.
function matchDonation(d,shs,drs){
  const src=donors.find(x=>x.id===d.donor),L=left(d),drv=nearestDriver(src,drs),pick=drv?Math.round(dist(drv,src)*MPK):null;
  return shs.map(s=>{
    const km=dist(src,s),del=Math.round(km*MPK),req=(pick??30)+del+BUF;
    const capOk=s.cap>=d.qty,need=s.needs.includes(d.cat),timeOk=!!drv&&L>=req;
    const score=Math.round(30*Math.max(0,1-km/10)+(capOk?25:0)+(need?20:6)+(timeOk?25*Math.min(1,(L-req)/60):0));
    const checks=[[km<=5,km<=5?'Within acceptable distance':'Farther than 5 km'],[capOk,capOk?'Capacity available':`Only ${s.cap} kg free`],[need,need?'Food type requested':'Category not currently requested'],[timeOk,timeOk?'Can receive before expiry':'Not Feasible: trip exceeds time window']];
    return {s,km,del,pick,req,L,score,checks,valid:capOk&&timeOk,drv};
  }).sort((a,b)=>(b.valid-a.valid)||b.score-a.score);
}
/* ---------- ui primitives ---------- */
const B='rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2.5 transition',B2='rounded-lg border border-slate-300 hover:bg-slate-50 text-sm font-semibold px-4 py-2.5 transition',INP='w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white';

const Badge=({tone='slate',children})=>html`<span class=${'inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1 whitespace-nowrap '+TONES[tone]}>${children}</span>`;
const Timer=({d})=>{const t=tone(d);return html`<${Badge} tone=${t}>${t==='red'?'⛔':'⏱'} ${fmt(d)}${t==='amber'?' · Expiring soon':''}<//>`};
const Empty=({t})=>html`<div class="text-center text-slate-500 border border-dashed border-slate-300 rounded-2xl p-10 text-sm">${t}</div>`;
const Kpi=({i,l,v,s})=>html`<div class="bg-white rounded-2xl border shadow-sm p-4"><div class="flex items-center gap-2 text-sm text-slate-500"><span>${i}</span>${l}</div><div class="text-2xl font-bold mt-1">${v}</div>${s&&html`<div class="text-xs text-slate-400">${s}</div>`}</div>`;
const Panel=({t,children,r})=>html`<section class="bg-white rounded-2xl border shadow-sm p-4"><div class="flex items-center justify-between mb-2"><h3 class="font-semibold">${t}</h3>${r}</div>${children}</section>`;
function Modal({onClose,title,children,wide}){return html`<div class="fixed inset-0 z-50 grid place-items-center p-3 bg-slate-900/50" onClick=${onClose}><div role="dialog" aria-label=${title} class=${'bg-white rounded-2xl shadow-xl w-full max-h-[92vh] overflow-y-auto '+(wide?'max-w-2xl':'max-w-md')} onClick=${e=>e.stopPropagation()}><div class="flex items-center justify-between px-5 py-4 border-b"><h2 class="font-semibold text-lg">${title}</h2><button onClick=${onClose} aria-label="Close" class="w-9 h-9 rounded-lg hover:bg-slate-100">✕</button></div><div class="p-5">${children}</div></div></div>`}
function Tracker({s}){const i=STAGES.indexOf(s);return html`<div class="flex items-start overflow-x-auto py-1">${STAGES.map((x,k)=>html`<div key=${x} class="flex items-start"><div class="flex flex-col items-center w-16"><span class=${'grid place-items-center w-6 h-6 rounded-full text-xs font-bold '+(k<i?'bg-emerald-600 text-white':k===i?'bg-emerald-100 text-emerald-800 ring-2 ring-emerald-600':'bg-slate-100 text-slate-400')}>${k<i?'✓':k===i?'●':'○'}</span><span class=${'text-[10px] mt-1 text-center leading-tight '+(k<=i?'text-slate-800 font-medium':'text-slate-400')}>${x}</span></div>${k<6&&html`<div class=${'h-0.5 w-3 mt-3 '+(k<i?'bg-emerald-600':'bg-slate-200')}></div>`}</div>`)}</div>`}
function Bars({v,l,c='bg-emerald-500'}){const m=Math.max(...v);return html`<div class="flex items-end gap-2 h-36">${v.map((x,i)=>html`<div key=${i} class="flex-1 flex flex-col items-center justify-end h-full"><span class="text-[10px] text-slate-500">${Math.round(x)}</span><div class=${'w-full rounded-t '+(i===v.length-1?c:'bg-slate-300')} style=${{height:(x/m*80)+'%'}}></div><span class="text-[10px] text-slate-500 mt-1">${l[i]}</span></div>`)}</div>`}
const HBar=({l,p})=>html`<div class="mb-2"><div class="flex justify-between text-sm"><span>${l}</span><span class="text-slate-500">${p}%</span></div><div class="h-2 rounded bg-slate-100"><div class="h-2 rounded bg-emerald-500" style=${{width:p+'%'}}></div></div></div>`;

const Field=({t,children})=>html`<label class="block text-sm font-medium text-slate-700">${t}<div class="mt-1">${children}</div></label>`;

    <${Field} t="Available from"><select class=${INP}><option>Now</option></select><//>

    <button class=${B+' w-full py-3 text-base'} onClick=${()=>+f.qty>0&&onSubmit({...f,qty:+f.qty,mins:+f.mins})}>Find Best Recipient</button>
    <p class="text-xs text-slate-500">Demo time-window logic only. This is not a food-safety certification.</p></div>`}
/* ---------- match results ---------- */

  const [ld,setLd]=useState(true);useEffect(()=>{const t=setTimeout(()=>setLd(false),1600);return()=>clearTimeout(t)},[]);

  const b=res[0],ok=b&&b.valid;

   ${ok?html`<div class="rounded-2xl border-2 border-emerald-500 bg-emerald-50/50 p-4"><div class="flex items-start justify-between gap-3"><div><Badge tone="green">Recommended match by criteria<//><h3 class="text-xl font-bold mt-1">${b.s.name}</h3><p class="text-sm text-slate-600">${b.km.toFixed(1)} km · ${b.del} min travel · ${b.s.cap} kg free capacity · needs ${d.cat.toLowerCase()} ${b.s.needs.includes(d.cat)?'✓':'✕'}</p></div><div class="text-center"><div class="text-3xl font-extrabold text-emerald-700">${b.score}</div><div class="text-[11px] text-slate-500">Match Score</div></div></div>
   <ul class="mt-3 grid sm:grid-cols-2 gap-1 text-sm">${b.checks.map(([o,t])=>html`<li key=${t} class=${o?'text-emerald-800':'text-red-700'}>${o?'✓':'✕'} ${t}</li>`)}</ul>
   <div class="mt-3 rounded-lg bg-white border p-3 text-sm"><b>Time feasibility:</b> ${b.L} min remaining ${b.L>=b.req?'≥':'<'} pickup ${b.pick} + delivery ${b.del} + buffer ${BUF} = ${b.req} min → <b>${b.L>=b.req?'✓ Feasible':'✕ Not Feasible'}</b> <span class="text-slate-400">(Demo estimate · driver ${b.drv.name})</span></div></div>`:html`<div class="rounded-xl bg-red-50 text-red-800 border border-red-200 p-4 text-sm">⚠ No shelter can receive this donation within its remaining window (${Math.max(0,b.L)} min) with enough capacity. Marked Not Feasible.</div>`}

   <p class="text-xs text-slate-500 mt-3">Weights: Distance 30 · Capacity 25 · Food need 20 · Time 25. Simple rules, no ML.</p>
   ${ok&&html`<button class=${B+' w-full mt-3 py-3'} onClick=${()=>onConfirm(b)}>Confirm Match</button>`}<//>`}
/* ---------- app ---------- */
function App(){
  const [role,setRole]=useState('donor'),[view,setView]=useState('overview'),[dons,setDons]=useState(seed),[log,setLog]=useState(LOG0),[notifs,setNotifs]=useState(N0),[toasts,setToasts]=useState([]),[modal,setModal]=useState(null),[nOpen,setNOpen]=useState(false),[sel,setSel]=useState(null),[fl,setFl]=useState({r:99,cat:'All',now:false}),[q,setQ]=useState(''),[,tick]=useState(0);

  const recent=html`${log.slice(0,4).map((l,i)=>html`<div key=${i} class="flex justify-between py-2 border-b last:border-0 text-sm"><span>✅ ${l.qty} kg ${l.food}<div class="text-xs text-slate-500">${donors.find(x=>x.id===l.donor).name} → ${shelters.find(x=>x.id===l.shelter).name}</div></span><span class="text-xs text-slate-400">${l.ago}</span></div>`)}`;

   <div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2"><${Panel} t="Live Rescue Activity" r=${html`<${Badge} tone="green">● Live<//>`}>${act.filter(d=>(d.food+d.cat).toLowerCase().includes(q.toLowerCase())).map(row)}${!act.length&&html`<${Empty} t="No active donations right now."/>`}<//></div>
   <div class="space-y-4"><${Panel} t="Expiring Soon">${soon.length?soon.map(d=>html`<div key=${d.id} class="flex justify-between items-center py-2 text-sm border-b last:border-0"><span>${ICON[d.cat]} ${d.food} · ${d.qty} kg</span><${Timer} d=${d}/></div>`):html`<p class="text-sm text-slate-500">Nothing urgent.</p>`}<//><${Panel} t="Recent Deliveries">${recent}<//></div></div>
